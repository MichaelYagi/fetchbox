[project]
name = "fetchbox-comics"
version = "0.1.0"
description = "Comics: series and issues from ComicVine, filed as CBZ or CBR."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fetchbox-plugin-api>=1,<2"]

[project.entry-points."fetchbox.plugins"]
comics = "fetchbox_comics:ComicsPlugin"

[dependency-groups]
# the test kit runs a real Fetchbox, offline
dev = ["fetchbox", "pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchbox_comics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
