name: Release

# Pushing a vX.Y.Z tag is the whole release trigger. This workflow is also the gate:
# the tests, the web build and a version check must all pass before anything is
# published, so a tag on a broken commit never becomes a release. The version lives in
# pyproject.toml (and web/package.json); the tag must match it.
#
# Published here (public): the wheels (Fetchbox and the plugin API it needs: pip install
# both, then `fetchbox serve`) and the sdists
# and a source zip, all with the web interface already built; and the Docker image
# ghcr.io/michaelyagi/fetchbox (linux/amd64 + arm64; tags X.Y.Z, X.Y, latest). The desktop apps are
# built in the fetchbox-artifacts repo and added to this release (see notify-desktop.yml).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches pyproject.toml and web/package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          WEB=$(python3 -c "import json; print(json.load(open('web/package.json'))['version'])")
          echo "tag $TAG, pyproject $PY, web $WEB"
          if [[ "$TAG" != "$PY" || "$TAG" != "$WEB" ]]; then
            echo "::error::tag v$TAG doesn't match pyproject.toml ($PY) and web/package.json ($WEB): bump both, commit, tag again"
            exit 1
          fi

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check . && uv run mypy && uv run lint-imports
      - run: uv run pytest -q

  release:
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface (bundled into the package)
        working-directory: web
        run: npm ci && npm run build
      - name: Wheel and sdist
        run: |
          uv build --python 3.12 --out-dir release
          uv build --python 3.12 --package fetchbox-plugin-api --out-dir release  # Fetchbox needs it
          rm -f release/.gitignore   # uv writes one; it isn't a release file
      - name: Both packages contain the web interface
        run: |
          python3 - <<'PY'
          import glob, tarfile, zipfile
          whl = zipfile.ZipFile(glob.glob("release/fetchbox-[0-9]*.whl")[0]).namelist()
          assert "fetchbox/static/index.html" in whl, "the wheel has no web interface"
          sdist = tarfile.open(glob.glob("release/fetchbox-[0-9]*.tar.gz")[0]).getnames()
          assert any(n.endswith("src/fetchbox/static/index.html") for n in sdist), "nor the sdist"
          PY
      - name: Source zip (with the built web interface)
        run: |
          STAGE="fetchbox-${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="$STAGE/" HEAD | tar -x
          cp -r src/fetchbox/static "$STAGE/src/fetchbox/static"
          zip -qr "release/${STAGE}-source.zip" "$STAGE"
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  docker:
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          V="${GITHUB_REF_NAME#v}"
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "list=$IMG:$V,$IMG:${V%.*},$IMG:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
