name: CI

on:
  push:
    branches: [main, "release-*"]  # release branches: cut from a tag, CI runs on push
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      # No GPL/AGPL dependencies, with one deliberate exception: mutagen (GPL-2.0-or-later)
      # writes music tags. Fetchbox's own code stays MIT; packaged builds that include
      # mutagen carry its license in THIRD-PARTY-NOTICES (packaging/README.md). Any other
      # GPL package still fails this check.
      - name: License check (fail on GPL/AGPL, mutagen excepted)
        run: >
          uv run pip-licenses --partial-match --ignore-packages mutagen
          --fail-on="GNU General Public License;GNU Affero General Public License;GPL-2.0;GPL-3.0;AGPL"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typed client matches the API
        run: |
          (cd .. && uv run --python 3.12 fetchbox openapi) > openapi.json
          npx openapi-typescript openapi.json -o src/lib/schema.d.ts
          git diff --exit-code -- openapi.json src/lib/schema.d.ts
      - run: npm run check
      - run: npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -v --durations=15

  freeze-smoke:
    # Proves libtorrent survives PyInstaller on every desktop target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .smoke
      - run: uv pip install --python .smoke libtorrent pyinstaller
      - name: Freeze
        shell: bash
        run: |
          PY=.smoke/bin/python; [ -f .smoke/Scripts/python.exe ] && PY=.smoke/Scripts/python.exe
          "$PY" -m PyInstaller --log-level WARN --onefile packaging/smoke/lt_smoke.py --distpath dist
      - name: Run frozen binary
        shell: bash
        run: ./dist/lt_smoke* 

  docker:
    # The image builds and its container starts, answers and serves the web UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fetchbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the container
        run: |
          mkdir -p /tmp/media && sudo chown 1000:1000 /tmp/media
          docker run -d --name fb -p 8787:8787 -e FETCHBOX_ADMIN_PASSWORD=ci-password-123 \
            -v /tmp/media:/data fetchbox:ci
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/v1/system/ping && break; sleep 2
          done
          curl -sf http://127.0.0.1:8787/ | grep -qi "<html"
          # the library folders appear with the first storage check, just after startup
          for i in $(seq 1 45); do test -d /tmp/media/Movies && break; sleep 2; done
          # the server runs as PUID 1000, not root (tini, PID 1, stays root to reap)
          docker exec fb sh -c 'for p in /proc/[0-9]*; do grep -qa "fetchbox" $p/cmdline 2>/dev/null && grep "^Uid:" $p/status; done' | tee /dev/stderr | grep -qE "Uid:\s+1000\b"
          test "$(stat -c %u /tmp/media/Movies)" = 1000            # what it creates is the user's
          curl -sf -X POST http://127.0.0.1:8787/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-password-123"}' -o /dev/null
          ls -la /tmp/media                                         # Movies/, TV/
          # downloads go into the library folders themselves: no separate Torrents folder
          test -d /tmp/media/Movies && test -d /tmp/media/TV && test ! -e /tmp/media/Torrents
      - if: failure()
        run: docker logs fb
