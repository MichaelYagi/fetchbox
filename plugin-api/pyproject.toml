# fetchbox-plugin-api: the plugin API on its own, for writing, type-checking and testing a
# plugin without installing Fetchbox. Fetchbox depends on it (a workspace member here),
# so there's one copy of the API in any environment.
[project]
name = "fetchbox-plugin-api"
version = "1.0.0.dev0"  # API 1 (the major number is the API version)
description = "The Fetchbox plugin API: base classes, types and the test kit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "httpx>=0.27"]

[project.optional-dependencies]
# the test kit (fetchbox_plugin.testing); it also needs Fetchbox itself installed
testing = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/MichaelYagi/fetchbox"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchbox_plugin"]
